<div class="modal fade" id="exampleModalToggle" aria-hidden="true" aria-labelledby="exampleModalToggleLabel"
  tabindex="-1" #modalB>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Number Of Questions</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label for="numberOfQuestions" class="form-label">Enter the number of questions:</label>
        <input type="number" class="form-control" [(ngModel)]="numberOfQuestions"
          placeholder="Enter number of questions">
      </div>
      <div class="modal-footer">
        <button class="btn btn-pink text-white" data-bs-target="#exampleModalToggle2"
          data-bs-toggle="modal">Done</button>
      </div>
    </div>
  </div>
</div>





<div class="modal fade" id="exampleModalToggle2" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2"
  tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">

        <form [formGroup]="questionForm" class="w-100 mt-2">
          <div class="mb-3">
            <label class="" id="exampleModalToggleLabel2">Enter Question Text</label>
            <input type="text" class="form-control" placeholder="Enter the question text" formControlName="text">

          </div>
          <div class="w-100"><button class="btn btn-pink text-white d-block ms-auto">Save Question</button>
          </div>

        </form>




      </div>
      <div class="modal-body">


        <form [formGroup]="choicesForm" class="mt-3">

          <div>
            <div class=" mb-3 d-flex gap-2 justify-content-between align-items-center">
              <div class="w-100"><label class="form-label">Enter Choice </label>
                <input type="text" class="form-control" formControlName="text" placeholder="Enter choice">
              </div>
              <div class="form-check mt-4">
                <input class="form-check-input" type="radio" [value]="true" formControlName="is_correct">
                <label class="form-check-label text-success">
                  correct
                </label>
              </div>


            </div>
          </div>

        </form>




      </div>
      <div class="modal-footer">
        <button class="btn btn-pink text-end text-white d-block ms-auto" type="submit" (click)="addChoice()">Save
          Choices</button>

      </div>
    </div>
  </div>
</div>
