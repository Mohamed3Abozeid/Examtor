<!-- Enter The Number Of Questions -->
<div class="modal fade" id="exampleModalToggle" aria-hidden="true" aria-labelledby="exampleModalToggleLabel"
  tabindex="-1" #modalB>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Number Of Questions</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="questionNumberForms">
          <label for="numberOfQuestions" class="form-label">Enter the number of
            questions:</label>
          <input type="text" class="form-control" placeholder="Enter number of questions"
            formControlName="numberOfQuestion">
          <button class="btn btn-pink text-white d-block ms-auto my-2" type="submit" (click)="getNumberOfQuestion()">Set
            Numbers</button>
        </form>

      </div>
      <div class="modal-footer">
        <button class="btn btn-pink text-white" data-bs-target=" #exampleModalToggle2" data-bs-toggle="modal">Go
          Next</button>
      </div>
    </div>
  </div>
</div>





<div class="modal fade" id="exampleModalToggle2" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2"
  tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <h6 class="fs-6 text-danger">Question {{numberOfQuestions}}</h6>
      <div class="modal-header">
        <form [formGroup]="questionForm" class="w-100 mt-2">
          <div class="mb-3">
            <label class="" id="exampleModalToggleLabel2">Enter Question Text</label>
            <input type="text" class="form-control" placeholder="Enter the question text" formControlName="text">

          </div>
          <div class="w-100"><button class="btn btn-pink text-white d-block ms-auto" (click)="submitQuestion()">Save
              Question</button>
          </div>

        </form>




      </div>
      <div class="modal-body">


        <form [formGroup]="choice1Form" class="mt-3">

          <div>
            <div class=" mb-3 ">
              <div class="w-100"><label class="form-label">Enter Choice <span class="fa-6 text-success">(The Correct
                    Answer)</span> </label>
                <input type="text" class="form-control" formControlName="text" placeholder="Enter choice">
              </div>
              <div class="w-100">
                <button class="btn btn-pink d-block text-white mt-2 ms-auto" type="button"
                  (click)="addChoice(choice1Form)" [disabled]="!questionId">Submit
                  Choice</button>

              </div>



            </div>
          </div>

        </form>
        <form [formGroup]="choice2Form" class="mt-3">

          <div>
            <div class=" mb-3 ">
              <div class="w-100"><label class="form-label">Enter Choice </label>
                <input type="text" class="form-control" formControlName="text" placeholder="Enter choice">
              </div>
              <div class="w-100">
                <button class="btn btn-pink d-block text-white mt-2 ms-auto" type="button"
                  (click)="addChoice(choice2Form)" [disabled]="!questionId">Submit
                  Choice</button>

              </div>



            </div>
          </div>

        </form>
        <form [formGroup]="choice3Form" class="mt-3">

          <div>
            <div class=" mb-3 ">
              <div class="w-100"><label class="form-label">Enter Choice </label>
                <input type="text" class="form-control" formControlName="text" placeholder="Enter choice">
              </div>
              <div class="w-100">
                <button class="btn btn-pink d-block text-white mt-2 ms-auto" type="button"
                  (click)="addChoice(choice3Form)" [disabled]="!questionId">Submit
                  Choice</button>

              </div>


            </div>
          </div>

        </form>
        <form [formGroup]="choice4Form" class="mt-3">

          <div>
            <div class=" mb-3 ">
              <div class="w-100"><label class="form-label">Enter Choice </label>
                <input type="text" class="form-control" formControlName="text" placeholder="Enter choice">
              </div>
              <div class="w-100">
                <button class="btn btn-pink d-block text-white mt-2 ms-auto" type="button"
                  (click)="addChoice(choice4Form)" [disabled]="!questionId">Submit
                  Choice</button>

              </div>


            </div>
          </div>

        </form>




      </div>
      <div class="modal-footer">
        <button class="btn btn-success w-100">Go To
          Next
          Questions</button>

      </div>
    </div>
  </div>
</div>
